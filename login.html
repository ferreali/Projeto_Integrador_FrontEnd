<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Portal+</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-info">
      <a class="logo" href="index.html">Portal<span>+</span></a>
      <p class="eyebrow">ÁREA DO USUÁRIO</p>
      <h1>Bem-vindo de volta.</h1>
      <p>Acesse seu dashboard para visualizar seus dados e testar o fluxo de autenticação.</p>
    </section>

    <section class="auth-card" aria-labelledby="loginTitle">
      <a class="back-link" href="index.html">← Voltar ao início</a>
      <h2 id="loginTitle">Entrar</h2>
      <p>Use os dados cadastrados neste navegador.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>

        <p id="loginMessage" class="form-message" role="alert" aria-live="assertive"></p>
        <button type="submit" class="btn btn-full">Entrar</button>
      </form>

      <p class="auth-footer">Ainda não possui conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>
</body>
</html>
